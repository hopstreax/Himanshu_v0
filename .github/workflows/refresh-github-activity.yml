name: Sync GitHub Contribution Activity

on:
  schedule:
    # Run once daily at 03:00 UTC (08:30 AM IST)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-activity:
    name: Refresh Contribution Calendar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute GitHub calendar sync
        env:
          # Prefers SYNC_GITHUB_TOKEN secret if configured, falling back to built-in GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run refresh:github

      - name: Detect changes in data/githubActivity.ts
        id: verify_diff
        run: |
          if git diff --quiet data/githubActivity.ts; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No contribution data changes detected. Skipping commit."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Contribution data updated. Preparing commit."
          fi

      - name: Commit and push synchronized activity data
        if: steps.verify_diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/githubActivity.ts
          git commit -m "chore(data): synchronize github contribution activity [skip ci]"
          git push
